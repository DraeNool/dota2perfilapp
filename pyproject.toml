[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-config-sync"
version = "5.0.1"
description = "Sincroniza configuración y hero grids entre cuentas de Steam/Dota 2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "customtkinter==5.2.2",
    "requests==2.34.2",
    "Pillow==12.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.0", "bandit>=1.7", "pip-audit>=2.7"]

[project.gui-scripts]
dota-config-sync = "dota_config_sync.app:main"

[tool.setuptools.packages.find]
include = ["dota_config_sync*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
